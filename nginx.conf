upstream keyfall_relay {
  # Docker compose DNS: the relay service is reachable by its service name.
  server keyfall-relay:3030;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  sendfile on;
  tcp_nopush on;
  gzip on;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  # WebSocket upgrade to the pair-mirror relay. Long-lived, no buffering.
  location /ws {
    proxy_pass http://keyfall_relay;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Hashed build assets — safe to cache aggressively.
  location /assets/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service worker must revalidate so updates roll out promptly.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # HTML shell and manifest should revalidate on each load.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { } default_type application/manifest+json;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
