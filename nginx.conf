server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  sendfile on;
  tcp_nopush on;
  gzip on;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  # Hashed build assets — safe to cache aggressively.
  location /assets/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service worker must revalidate so updates roll out promptly.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # HTML shell and manifest should revalidate on each load.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { } default_type application/manifest+json;
  }

  # WebSocket relay for iPad pair-mirror. Upstream is resolved at
  # request time (not nginx startup) so the container boots cleanly
  # even when the relay isn't running — only /mirror/ws returns 502,
  # the main app keeps working. `mirror:8081` resolves via Docker's
  # embedded DNS on any user-defined network (including the one
  # docker-compose creates by default). To run the relay elsewhere,
  # mount an override of this file.
  resolver 127.0.0.11 ipv6=off valid=30s;

  # HTTP API for server-side song storage. Same backend as the WS relay.
  location /api/ {
    set $mirror_api "mirror:8081";
    proxy_pass http://$mirror_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 10m;
  }

  location /mirror/ws {
    set $mirror_upstream "mirror:8081";
    proxy_pass http://$mirror_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
