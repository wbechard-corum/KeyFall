<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0c0f">
<title>KeyFall</title>
<link rel="manifest" href="./manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles/main.css">
</head>
<body>
<div id="app">
  <nav class="mode-nav" id="modeNav">
    <div class="mode-brand">KeyFall<span>v0.2</span></div>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="trainer">TRAINER</button>
      <button class="mode-tab" data-mode="controller">CONTROLLER</button>
    </div>
    <div class="mode-midi">
      <div class="midi-dot" id="globalMidiDot"></div>
      <span id="globalMidiLabel">NO MIDI</span>
    </div>
  </nav>

  <section class="mode-view" id="trainerView"></section>
  <section class="mode-view hidden" id="controllerView"></section>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
