<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0c0f">
<title>KeyFall</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles/main.css">
</head>
<body>
<div id="app">
  <nav class="mode-nav" id="modeNav">
    <div class="mode-brand">KeyFall<span id="appVersion"></span></div>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="trainer">LIVE</button>
      <button class="mode-tab" data-mode="songs">SONGS</button>
      <button class="mode-tab" data-mode="controller">PATCHES</button>
      <button class="mode-tab" data-mode="settings">SETTINGS</button>
    </div>
    <button class="mode-remote" id="modeRemote" title="Use this device as a remote for another KeyFall session">REMOTE</button>
    <div class="mode-midi">
      <div class="midi-dot" id="globalMidiDot"></div>
      <span id="globalMidiLabel">NO MIDI</span>
    </div>
  </nav>

  <section class="mode-view" id="trainerView"></section>
  <section class="mode-view hidden" id="songsView"></section>
  <section class="mode-view hidden" id="controllerView"></section>
  <section class="mode-view hidden" id="settingsView"></section>

  <div class="remote-modal hidden" id="remoteModal">
    <div class="remote-modal-backdrop" data-role="backdrop"></div>
    <div class="remote-modal-card">
      <div class="remote-modal-title">Connect as Remote</div>
      <div class="remote-modal-help">Enter the 6-digit code from the host's Controller → Settings → Mirror to iPad panel.</div>
      <input
        type="text"
        inputmode="numeric"
        pattern="\d{6}"
        maxlength="6"
        autocomplete="off"
        class="remote-modal-input"
        id="remoteCodeInput"
        placeholder="000000"
      >
      <div class="remote-modal-error hidden" id="remoteModalError"></div>
      <div class="remote-modal-actions">
        <button class="remote-modal-btn" id="remoteCancel">Cancel</button>
        <button class="remote-modal-btn primary" id="remoteConnect">Connect</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
